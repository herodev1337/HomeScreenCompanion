name: Build plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: HomeScreenCompanion/HomeScreenCompanion.csproj

jobs:
  build:
    name: Build HomeScreenCompanion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: 'HomeScreenCompanion/ClientApp/package-lock.json'

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build (Release)
        run: dotnet build "$PROJECT" -c Release --no-restore

      - name: Verify C# formatting
        run: dotnet format whitespace "$PROJECT" --verify-no-changes --no-restore

      - name: Install JS deps
        working-directory: HomeScreenCompanion/ClientApp
        run: npm ci

      - name: Build JS bundle
        working-directory: HomeScreenCompanion/ClientApp
        run: npm run build

      - name: TS typecheck
        working-directory: HomeScreenCompanion/ClientApp
        run: npm run typecheck

      - name: JS tests (module suite)
        working-directory: HomeScreenCompanion/ClientApp
        run: npm test

      - name: JS lint
        working-directory: HomeScreenCompanion/ClientApp
        run: npm run lint

      - name: .NET tests (DLL snapshot)
        run: dotnet test tests/HomeScreenCompanion.Tests/HomeScreenCompanion.Tests.csproj -c Release --verbosity normal

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: HomeScreenCompanion
          path: HomeScreenCompanion/bin/Release/netstandard2.0/HomeScreenCompanion.dll
          if-no-files-found: error
