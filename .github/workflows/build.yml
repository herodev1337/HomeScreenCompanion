name: Build & release

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release (auto = derive from branch name)
        type: choice
        default: auto
        options: [ auto, build, patch, minor, major, none ]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: build-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: HomeScreenCompanion/HomeScreenCompanion.csproj
  TESTS: tests/HomeScreenCompanion.Tests/HomeScreenCompanion.Tests.csproj
  DLL: HomeScreenCompanion/bin/Release/netstandard2.0/HomeScreenCompanion.dll

jobs:
  build-release:
    name: Build, test & release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On PR-merge (pull_request.action=closed, merged=true) check out
          # the PR's base ref (main) so the version bump commits to main.
          # On every other event check out the PR head (or the workflow_dispatch ref).
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.base.ref || github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Determine bump type & release intent
        id: meta
        run: |
          resolve_branch_bump() {
            case "$1" in
              fix/*|bugfix/*|hotfix/*|fix) echo "patch" ;;
              feat/*|feature/*|feat) echo "minor" ;;
              breaking/*|major/*|breaking) echo "major" ;;
              *) echo "none" ;;
            esac
          }

          BUMP="none"
          RELEASE="false"

          case "${{ github.event_name }}" in
            workflow_dispatch)
              RELEASE="true"
              if [[ "${{ inputs.bump }}" == "auto" ]]; then
                BUMP="$(resolve_branch_bump "${GITHUB_REF_NAME}")"
                [[ "$BUMP" == "none" ]] && BUMP="build"
              else
                BUMP="${{ inputs.bump }}"
              fi
              ;;
            pull_request)
              # Only release on actual merge to base.
              if [[ "${{ github.event.action }}" == "closed"
                    && "${{ github.event.pull_request.merged }}" == "true"
                    && "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
                BUMP="$(resolve_branch_bump "${{ github.event.pull_request.head.ref }}")"
                [[ "$BUMP" != "none" ]] && RELEASE="true"
              fi
              ;;
          esac

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }}/${{ github.event.action }} head=${{ github.event.pull_request.head.ref }} base=${{ github.event.pull_request.base.ref }} merged=${{ github.event.pull_request.merged }} bump=$BUMP release=$RELEASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip release branch
        if: steps.meta.outputs.release != 'true'
        run: |
          echo "Skipping release (event=${{ github.event_name }} action=${{ github.event.action }} merged=${{ github.event.pull_request.merged }} base=${{ github.event.pull_request.base.ref }} head=${{ github.event.pull_request.head.ref }})"

      - name: Determine next version
        id: version
        if: steps.meta.outputs.release == 'true'
        run: |
          echo "version=$(node scripts/bump-version.mjs "${{ steps.meta.outputs.bump }}")" >> "$GITHUB_OUTPUT"
          if git diff --quiet version.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version bump
        if: steps.meta.outputs.release == 'true' && steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build (Release)
        run: dotnet build "$PROJECT" -c Release --no-restore

      - name: Verify C# formatting
        run: dotnet format whitespace "$PROJECT" --verify-no-changes --no-restore

      - name: .NET tests
        run: dotnet test "$TESTS" -c Release --verbosity minimal

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: HomeScreenCompanion
          path: ${{ env.DLL }}
          if-no-files-found: error

      - name: Create tag & GitHub release
        if: steps.meta.outputs.release == 'true' && steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ env.DLL }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target main
